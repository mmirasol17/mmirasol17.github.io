# Regenerate the project-preview screenshots (screenshots/capture.mjs) and open
# a PR with whatever changed. Public pages only - no login, no secrets.
#
# This is a MANUAL job (no schedule): Actions tab -> "Regenerate project
# previews" -> Run workflow. It captures the live apps, converts to webp under
# public/images/project-previews/, and opens a reviewable PR (binaries don't get
# pushed straight to master). It reuses one branch, so re-running updates the
# same PR instead of stacking duplicates.

name: Regenerate project previews

on:
  workflow_dispatch:

concurrency:
  group: regenerate-previews
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Capture & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner's Google Chrome apt source intermittently fails a mirror hash
      # check inside `--with-deps`; drop it so apt only hits Ubuntu mirrors, and
      # retry to ride out transient hiccups.
      - name: Install Playwright (Chromium)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-cloud-sdk.list
          n=0
          until [ "$n" -ge 3 ]; do
            npx playwright install --with-deps chromium && exit 0
            n=$((n + 1)); echo "playwright install attempt $n failed; retrying in 15s..."; sleep 15
          done
          exit 1

      - name: Capture screenshots
        run: npm run screenshots

      - name: Open pull request with regenerated previews
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/regenerate-previews
          base: master
          commit-message: "chore: regenerate project preview screenshots"
          title: "chore: regenerate project previews"
          body: |
            Automated capture from the **Regenerate project previews** workflow.

            Review the image diffs, then merge if they look right.
          add-paths: |
            public/images/project-previews/**

      # create-pull-request keeps a single PR on chore/regenerate-previews, so
      # re-runs update it rather than duplicating. Belt-and-suspenders: close any
      # OTHER open "regenerate previews" PRs (e.g. from a stray branch) so they
      # never pile up.
      - name: Close any redundant preview PRs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --state open --search 'in:title "regenerate project previews"' \
              --json number,headRefName -q '.[] | select(.headRefName != "chore/regenerate-previews") | .number'); do
            echo "Closing redundant PR #$pr"
            gh pr close "$pr" --comment "Superseded by the latest preview-regeneration run." || true
          done
