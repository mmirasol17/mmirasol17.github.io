<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Eighth note (bold strokes: tab favicons render at 16-32px, thin strokes turn to mush) -->
  <ellipse cx="21.5" cy="75" rx="11.5" ry="9.5" transform="rotate(-20 21.5 75)" fill="white"/>
  <line x1="31" y1="77" x2="31" y2="21" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <path d="M31 21 C55 27 53 47 31 51" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 equalizer bars (right side, bottom-aligned, full pill shape) -->
  <rect x="47" y="52" width="14" height="32" rx="7" fill="white" opacity="0.75"/>
  <rect x="64" y="34" width="14" height="50" rx="7" fill="white"/>
  <rect x="81" y="46" width="14" height="38" rx="7" fill="white" opacity="0.88"/>
</svg>
